name: Update Visual Snapshots (CI canonical)

on:
  workflow_dispatch:

jobs:
  update-snapshots:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Update visual snapshots (canonical)
        env:
          CI: "1"
        run: |
          npm run test:e2e:update
          npm run test:e2e:visual:fullpage -- --update-snapshots
      - name: Upload updated snapshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-linux-snapshots
          path: |
            tests/e2e/baseline.spec.js-snapshots
            tests/e2e/sections.spec.js-snapshots
            tests/e2e/fullpage.spec.js-snapshots
