name: Update Playwright Snapshots (Linux)

on:
  workflow_dispatch:

jobs:
  update-snapshots:
    runs-on: ubuntu-22.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-jammy
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Update Linux snapshots
        run: npm run test:e2e:update
      - name: Upload updated snapshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-linux-snapshots
          path: |
            tests/e2e/baseline.spec.js-snapshots
            tests/e2e/sections.spec.js-snapshots
