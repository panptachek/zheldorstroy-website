name: Quality Gates

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  quality_blocking:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium (pinned by lockfile)
        run: npx playwright install --with-deps chromium
      - name: Setup Chrome Stable
        uses: browser-actions/setup-chrome@v1
      - name: Export CHROME_PATH
        run: |
          echo "CHROME_PATH=$(which google-chrome)" >> "$GITHUB_ENV"
          echo "Resolved CHROME_PATH=$(which google-chrome)"
      - name: Playwright smoke (blocking)
        run: npx playwright test tests/e2e/smoke.spec.js
      - name: Lighthouse (retry on NO_FCP)
        run: |
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/preview.log 2>&1 &
          sleep 2
          for i in 1 2 3; do
            echo "Lighthouse attempt $i"
            if npx lighthouse http://127.0.0.1:4173 \
              --chrome-flags='--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-software-rasterizer' \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output-path=./lighthouse-report.json; then
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "Lighthouse failed after 3 attempts"
              exit 1
            fi
            sleep 3
          done
          node ./scripts/lighthouse-threshold-check.mjs ./lighthouse-report.json

  visual_advisory:
    runs-on: ubuntu-22.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-jammy
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Playwright visual baseline (advisory)
        run: npm run test:e2e:visual
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: artifacts/test-results
          if-no-files-found: ignore

  browserstack:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Skip when BrowserStack secrets are missing
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "BrowserStack secrets are not set. Skipping BrowserStack job."
            exit 0
          fi
      - name: BrowserStack Playwright run
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "Skipped"
            exit 0
          fi
          npm run test:e2e:browserstack
